<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Token 兑换中心</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .icon { font-size: 60px; text-align: center; margin-bottom: 20px; }
        h1 { text-align: center; color: #333; margin-bottom: 10px; }
        .subtitle { text-align: center; color: #888; margin-bottom: 30px; }
        .input-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #555; font-weight: 500; }
        input {
            width: 100%;
            padding: 14px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            text-align: center;
            letter-spacing: 3px;
        }
        input:focus { outline: none; border-color: #667eea; }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover { opacity: 0.9; transform: translateY(-2px); }
        button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        
        .result {
            margin-top: 20px;
            padding: 20px;
            border-radius: 10px;
            display: none;
        }
        .result.success { background: #d4edda; display: block; }
        .result.error { background: #f8d7da; color: #721c24; display: block; }
        
        .api-key-box {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            font-family: monospace;
            word-break: break-all;
            font-size: 13px;
            margin-top: 10px;
        }
        .copy-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
        }
        
        .instructions {
            background: #fff3cd;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            font-size: 13px;
            color: #856404;
        }
        .instructions code {
            background: #ffeeba;
            padding: 2px 6px;
            border-radius: 4px;
            display: block;
            margin: 5px 0;
            word-break: break-all;
        }
        
        .loading {
            text-align: center;
            padding: 30px;
            display: none;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .admin-link { text-align: center; margin-top: 20px; }
        .admin-link a { color: #667eea; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🎁</div>
        <h1>Token 兑换中心</h1>
        <p class="subtitle">输入授权码即可兑换 API Key</p>
        
        <div class="input-group">
            <label>授权码</label>
            <input type="text" id="licenseKey" placeholder="请输入授权码">
        </div>
        
        <button id="submitBtn" onclick="redeem()">立即兑换</button>
        
        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>正在处理...</p>
        </div>
        
        <div id="result" class="result"></div>
        
        <div class="admin-link">
            <a href="/admin">管理员入口</a>
        </div>
    </div>
    
    <script>
        async function redeem() {
            const licenseKey = document.getElementById('licenseKey').value.trim();
            const submitBtn = document.getElementById('submitBtn');
            const loading = document.getElementById('loading');
            const result = document.getElementById('result');
            
            if (!licenseKey) {
                result.className = 'result error';
                result.textContent = '请输入授权码';
                result.style.display = 'block';
                return;
            }
            
            submitBtn.style.display = 'none';
            loading.style.display = 'block';
            result.style.display = 'none';
            
            try {
                const res = await fetch('/redeem', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ licenseKey })
                });
                
                const data = await res.json();
                
                if (data.success) {
                    result.className = 'result success';
                    result.innerHTML = `
                        <h3>🎉 兑换成功！</h3>
                        <p style="margin:10px 0;">获得额度: <strong>${(data.quota / 10000).toFixed(0)} 万</strong></p>
                        <p>API Key:</p>
                        <div class="api-key-box">${data.apiKey}</div>
                        <button class="copy-btn" onclick="copyKey('${data.apiKey}')">📋 复制 API Key</button>
                        <div class="instructions">
                            <strong>使用方法：</strong>
                            <code>base_url: "${data.apiUrl}/v1"</code>
                            <code>api_key: "${data.apiKey}"</code>
                        </div>
                    `;
                    document.getElementById('licenseKey').value = '';
                } else {
                    result.className = 'result error';
                    result.textContent = '❌ ' + data.message;
                }
            } catch (err) {
                result.className = 'result error';
                result.textContent = '❌ 网络错误，请稍后重试';
            } finally {
                submitBtn.style.display = 'block';
                loading.style.display = 'none';
            }
        }
        
        function copyKey(key) {
            navigator.clipboard.writeText(key);
            alert('API Key 已复制！');
        }
    </script>
</body>
</html>
